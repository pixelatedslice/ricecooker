[package]
name = "ricecooker"
version = "0.1.0"
edition = "2024"

[dependencies]
color-eyre = "0.6.5"
ratatui = "0.30.0"
reqwest = "0.13.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = "1.52.3"
crossterm = "0.29.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true