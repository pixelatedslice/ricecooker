[package]
name = "ricecooker"
version = "0.1.0"
edition = "2024"
authors = ["pixelatedslice <contact@pixelatedslice.com>"]

[dependencies]
color-eyre = "0.6.5"
reqwest = { version = "0.13.3", features = ["json", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-appender = "0.2.5"
tokio = { version = "1.52.3", features = ["full"] }
thiserror = "2.0.18"
tracing-error = "0.2.1"
clap = { version = "4.6.1", features = ["derive"] }
indoc = "2.0.7"
futures-util = "0.3.32"
libc = "0.2.186"
runtime-format = "0.1.3"
which = "8.0.2"
regex = "1.12.3"
url = { version = "2.5.8", features = ["serde"] }
aho-corasick = "1.1.4"

[dev-dependencies]
proptest = "1.11.0"
protest-derive = "1.1.0"

[build-dependencies]
embed-resource = "3.0.9"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
